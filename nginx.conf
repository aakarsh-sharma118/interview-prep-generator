# ==============================================================================
# Nginx Reverse Proxy Configuration
# Author: Aakarsh Sharma
#
# Proxies incoming HTTP traffic:
# - Routes /api/* to the Express backend
# - Routes / and all client routes to Next.js
# - Preserves JWT Authorization headers across upstream requests
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Basic performance tuning
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for text and json payloads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream servers
    upstream frontend_upstream {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # ── Backend API Proxy ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            # Forward client identification
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward JWT Authorization token
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # Timeouts for deep LLM generation and crawling
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── Backend Healthcheck Route ──────────────────────────────────────────
        location /health {
            proxy_pass http://backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Next.js Frontend Proxy ─────────────────────────────────────────────
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            # WebSocket upgrade support for Next.js hot-reloading
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
